[package]
name = "harvis-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true

[[bin]]
name = "harvis"
path = "src/main.rs"

[dependencies]
anyhow.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
serde_yaml_ng = "0.10"
harvis-core = { path = "../harvis-core" }
harvis-integrations = { path = "../harvis-integrations" }
harvis-http = { path = "../harvis-http" }
harvis-macos = { path = "../harvis-macos" }
harvis-mcp = { path = "../harvis-mcp" }
harvis-runtime = { path = "../harvis-runtime" }

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2.186"
